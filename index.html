<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Cliques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #fef6ee;
    --bg-2: #eef6fb;
    --panel: #fffdfa;
    --border: #f0e4d8;
    --text: #6b5d54;
    --muted: #b8ab9f;
    --accent: #7fb8dd;
    --accent-dark: #5fa0cc;
    --danger: #e2a37e;
    font-family: 'Quicksand', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 16px 90px 16px;
    position: relative;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.02em;
    margin: 6px 0 4px 0;
  }
  h1::before {
    content: "🐾 ";
  }
  #stage-indicator {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 8px 0;
    letter-spacing: 0.02em;
  }
  #admin-nav {
    display: flex;
    gap: 8px;
    margin: 0 0 14px 0;
  }
  #admin-nav button {
    font-size: 0.72rem;
    padding: 5px 12px;
    border-radius: 14px;
    border: 1px dashed var(--muted);
    background: transparent;
    color: var(--muted);
  }
  #admin-nav button:hover {
    background: #f4ede3;
  }

  #end-early-wrap {
    position: absolute;
    top: 20px;
    right: 20px;
  }
  #btn-end-early {
    font-weight: 600;
    font-size: 0.72rem;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #f0d9c8;
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    opacity: 0.75;
  }
  #btn-end-early:hover {
    background: #fdf1e8;
    opacity: 1;
  }
  #btn-end-early:disabled {
    opacity: 0.3;
    cursor: default;
    background: transparent;
  }

  #start-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex: 1;
    width: 100%;
    max-width: 480px;
    margin: auto;
  }
  #start-screen h1 {
    margin-bottom: 8px;
  }
  #start-text {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 22px 0;
  }
  #btn-start {
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    padding: 12px 32px;
    border-radius: 22px;
  }
  #btn-start:hover {
    background: var(--accent-dark);
  }

  #test-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #stage-outer {
    position: relative;
    width: 100%;
    max-width: 1000px;
  }
  #stage-wrap {
    position: relative;
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 1624 / 1044;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: 0 8px 30px rgba(140, 120, 100, 0.08);
    overflow: visible;
  }
  #lock-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255, 253, 250, 0.88);
    backdrop-filter: blur(2px);
    border-radius: 28px;
    pointer-events: auto;
  }
  .lock-message {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent-dark);
    text-align: center;
    line-height: 1.6;
  }
  .item {
    position: absolute;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    transition: transform 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    pointer-events: none;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.12));
  }
  .item:hover img {
    transform: scale(1.03);
  }
  .item:active {
    transform: scale(0.94);
  }
  .item.disabled {
    cursor: default;
  }
  .item.disabled:hover img {
    transform: none;
  }

  #controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px;
    box-shadow: 0 6px 20px rgba(140, 120, 100, 0.12);
  }

  button {
    font-family: inherit;
    font-weight: 600;
    font-size: 0.82rem;
    padding: 9px 18px;
    border-radius: 18px;
    border: none;
    cursor: pointer;
    transition: filter 0.1s ease, opacity 0.1s ease;
  }
  #btn-reset {
    background: #f4ede3;
    color: var(--muted);
  }
  #btn-reset:hover {
    background: #ece1d3;
  }
  #btn-finish {
    background: var(--accent);
    color: white;
  }
  #btn-finish:hover {
    background: var(--accent-dark);
  }
  button:disabled {
    opacity: 0.4;
    cursor: default;
  }
</style>
</head>
<body>

<div id="start-screen">
  <h1>🐾 clique nos coelhos</h1>
  <p id="start-text">quando estiver pronto, toque em iniciar</p>
  <button id="btn-start">iniciar</button>
</div>

<div id="test-area" style="display:none;">
  <div id="end-early-wrap">
    <button id="btn-end-early">Finalizar teste</button>
  </div>

  <div id="stage-indicator">etapa 1 de 33</div>
  <div id="admin-nav">
    <button id="btn-back" style="display:none;">voltar</button>
    <button id="btn-skip" style="display:none;"></button>
  </div>

  <div id="stage-outer">
    <div id="stage-wrap"></div>
    <div id="lock-overlay" style="display:none;">
      <div class="lock-message">🔒<br>teste concluído</div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-reset">reiniciar</button>
    <button id="btn-finish">terminei</button>
  </div>
</div>

ft": 5, "top": 5, "width": 28, "height": 28}, {"id": 2, "img": "circazul.png", "left": 36, "top": 5, "width": 28, "height": 28}, {"id": 3, "img": "cruzpreta.png", "left": 67, "top": 5, "width": 28, "height": 28}, {"id": 4, "img": "cruzbran.png", "left": 5, "top": 36, "width": 28, "height": 28}, {"id": 5, "img": "circverm.png", "left": 36, "top": 36, "width": 28, "height": 28}, {"id": 6, "img": "cruzama.png", "left": 67, "top": 36, "width": 28, "height": 28}, {"id": 7, "img": "circama.png", "left": 5, "top": 67, "width": 28, "height": 28}, {"id": 8, "img": "cruzazul.png", "left": 36, "top": 67, "width": 28, "height": 28}, {"id": 9, "img": "circpreto.png", "left": 67, "top": 67, "width": 28, "height": 28}]];
const TOTAL_STAGES = STAGES.length;

const stage = document.getElementById('stage-wrap');
const stageIndicator = document.getElementById('stage-indicator');
const lockOverlay = document.getElementById('lock-overlay');
const btnFinish = document.getElementById('btn-finish');
const btnEndEarly = document.getElementById('btn-end-early');
const btnReset = document.getElementById('btn-reset');
const btnBack = document.getElementById('btn-back');
const btnSkip = document.getElementById('btn-skip');
const btnStart = document.getElementById('btn-start');
const startScreen = document.getElementById('start-screen');
const testArea = document.getElementById('test-area');

// Regras de retrocesso/avanço por faixa etária de entrada:
// 6-12 anos entram no item 14; se errar 14 ou 15, volta pro 13, com botão de
// avançar disponível do item 7 ao 13. 13-16 entram no item 17; se errar 17 ou
// 18, volta pro 16, com botão de avançar disponível do item 10 ao 16.
const REGRESSION_RULES = [
  { failItems: [14, 15], backTo: 13, skipTo: 16, skipFloor: 7 },
  { failItems: [17, 18], backTo: 16, skipTo: 19, skipFloor: 10 },
];

// Registro interno completo: uma entrada por etapa, cada uma com a lista
// ordenada de cliques (id + ordem + timestamp) daquela etapa.
// Nada disso é mostrado na tela para quem faz o teste; será lido pelo hub futuramente.
let currentStage = 1;
let clicksThisStage = [];
let allStages = [];
let testFinished = false;
let regressionMode = false;
let activeRule = null;

function render() {
  const layout = STAGES[currentStage - 1];
  stage.innerHTML = '';
  layout.forEach(item => {
    const wrap = document.createElement('div');
    wrap.className = 'item';
    wrap.style.left = item.left + '%';
    wrap.style.top = item.top + '%';
    wrap.style.width = item.width + '%';
    wrap.style.height = item.height + '%';
    wrap.dataset.id = item.id;

    const img = document.createElement('img');
    img.src = item.img;
    img.draggable = false;
    wrap.appendChild(img);

    wrap.addEventListener('click', () => onItemClick(item.id));
    stage.appendChild(wrap);
  });
}

function onItemClick(id) {
  if (testFinished) return;
  clicksThisStage.push({ id: id, order: clicksThisStage.length + 1, t: Date.now() });
}

function finishStage() {
  if (testFinished) return;
  allStages.push({ stage: currentStage, clicks: clicksThisStage, endedEarly: false });
  clicksThisStage = [];
  if (regressionMode) {
    currentStage = Math.max(1, currentStage - 1);
    updateStageIndicator();
    updateAdminNav();
    render();
    return;
  }
  if (currentStage >= TOTAL_STAGES) {
    endTest();
  } else {
    currentStage++;
    updateStageIndicator();
    updateAdminNav();
    render();
  }
}

function findRuleForStage(stageNum) {
  return REGRESSION_RULES.find(r => r.failItems.includes(stageNum)) || null;
}

function goBack() {
  if (testFinished) return;
  const rule = findRuleForStage(currentStage);
  if (!rule) return;
  allStages.push({ stage: currentStage, clicks: clicksThisStage, endedEarly: false, jumped: 'backTo' + rule.backTo });
  clicksThisStage = [];
  currentStage = rule.backTo;
  regressionMode = true;
  activeRule = rule;
  updateStageIndicator();
  updateAdminNav();
  render();
}

function skipForward() {
  if (testFinished || !activeRule) return;
  allStages.push({ stage: currentStage, clicks: clicksThisStage, endedEarly: false, jumped: 'skipTo' + activeRule.skipTo });
  clicksThisStage = [];
  currentStage = activeRule.skipTo;
  regressionMode = false;
  activeRule = null;
  updateStageIndicator();
  updateAdminNav();
  render();
}

function endEarly() {
  if (testFinished) return;
  allStages.push({ stage: currentStage, clicks: clicksThisStage, endedEarly: true });
  clicksThisStage = [];
  endTest();
}

function endTest() {
  testFinished = true;
  document.querySelectorAll('.item').forEach(b => b.classList.add('disabled'));
  btnFinish.disabled = true;
  btnEndEarly.disabled = true;
  updateAdminNav();
  lockOverlay.style.display = 'flex';
}

function reset() {
  currentStage = 1;
  clicksThisStage = [];
  allStages = [];
  testFinished = false;
  regressionMode = false;
  activeRule = null;
  lockOverlay.style.display = 'none';
  btnFinish.disabled = false;
  btnEndEarly.disabled = false;
  updateStageIndicator();
  updateAdminNav();
  render();
}

function updateStageIndicator() {
  stageIndicator.textContent = 'etapa ' + currentStage + ' de ' + TOTAL_STAGES;
}

function updateAdminNav() {
  const backRule = findRuleForStage(currentStage);
  const showBack = !!backRule && !testFinished;
  btnBack.style.display = showBack ? 'inline-block' : 'none';

  const showSkip = regressionMode && activeRule && currentStage >= activeRule.skipFloor && currentStage <= activeRule.backTo && !testFinished;
  btnSkip.style.display = showSkip ? 'inline-block' : 'none';
  if (showSkip) {
    btnSkip.textContent = 'pular para o item ' + activeRule.skipTo;
  }
}

btnStart.addEventListener('click', () => {
  startScreen.style.display = 'none';
  testArea.style.display = 'block';
  updateAdminNav();
  render();
});

btnFinish.addEventListener('click', finishStage);
btnEndEarly.addEventListener('click', endEarly);
btnReset.addEventListener('click', reset);
btnBack.addEventListener('click', goBack);
btnSkip.addEventListener('click', skipForward);
</script>
